buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'dev.faris.knockernative'
version = '0.1.0'

android {
  namespace 'dev.faris.knockernative'
  buildFeatures { compose true }

  defaultConfig {
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName '0.1.0'
  }

  lint {
    abortOnError true
  }
}

dependencies {
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.work:work-testing:2.12.0'
  // Compose's transitive Espresso 3.5 uses reflection removed by Android 16.
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.8.0-alpha03'
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4-android:1.12.1'
  debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.1'
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3:1.5.0-rc01'
  implementation 'androidx.compose.material:material-icons-extended:1.7.8'
  implementation 'androidx.navigation3:navigation3-runtime:1.2.1'
  implementation 'androidx.navigation3:navigation3-ui:1.2.1'
  testImplementation "junit:junit:4.13.2"
  testImplementation 'org.json:json:20260814'
  implementation "androidx.security:security-crypto:1.1.0"
  implementation "androidx.work:work-runtime-ktx:2.12.0"
}
