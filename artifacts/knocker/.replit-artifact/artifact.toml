kind = "mobile"
previewPath = "/"
title = "Knocker"
version = "1.0.0"
id = "artifacts/knocker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19905

[services.development]
run = "pnpm --filter @workspace/knocker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/knocker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/knocker", "run", "serve" ]

[services.env]
PORT = "19905"
BASE_PATH = "/"
