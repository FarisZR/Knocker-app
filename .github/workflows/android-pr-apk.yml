name: Android PR APK comment

on:
  workflow_run:
    workflows: [Android CI and release]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: android-pr-apk-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # This privileged job runs only trusted default-branch code. It reads API
      # metadata, never downloads or executes anything produced by the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = require('./.github/scripts/android-pr-comment.cjs');
            await comment({ github, context, core });
