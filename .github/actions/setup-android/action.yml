name: Set up Android app
description: Install pinned JavaScript dependencies and Android build tools
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.28.2
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools build-tools;37.0.0
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
      with:
        # GitHub scopes PR writes to refs/pull/<number>/merge, so updates on the
        # same PR can reuse task outputs without changing the main branch cache.
        cache-read-only: false
    - name: Install native compiler cache
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends ccache
        # React Native's CMake project automatically uses ccache from PATH.
        # Hash the compiler contents because SDK timestamps change on fresh runners.
        echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        # Ccache validates source, flags, headers and target ABI itself. A fresh
        # key lets each successful run contribute newly compiled objects.
        key: ${{ runner.os }}-${{ runner.arch }}-android-ccache-v1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-android-ccache-v1-${{ hashFiles('pnpm-lock.yaml') }}-
    - name: Reset native compiler cache statistics
      shell: bash
      run: ccache --zero-stats
    - shell: bash
      run: pnpm install --frozen-lockfile
