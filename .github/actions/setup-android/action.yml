name: Set up Android workspace
description: Install pinned JavaScript dependencies and Android build tools
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.28.2
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
    - uses: gradle/actions/setup-gradle@v4
    - shell: bash
      run: pnpm install --frozen-lockfile
